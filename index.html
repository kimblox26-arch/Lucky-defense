<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>운빨 디펜스</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#1d2f16;
    font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
    font-weight:800; color:#4a3418; user-select:none; letter-spacing:-.2px; }
  svg{ display:block; }
  .ic{ display:inline-flex; align-items:center; justify-content:center; }
  .ic svg{ width:100%; height:100%; }

  #cv{ position:fixed; inset:0; display:block; touch-action:none; z-index:0; }
  #ui{ position:fixed; inset:0; z-index:2; pointer-events:none; opacity:1; transition:opacity .3s; }
  #ui > *{ pointer-events:auto; }
  #ui.off{ opacity:0; pointer-events:none; }

  /* ---------- 공통 패널 ---------- */
  .pill{ background:linear-gradient(180deg,#fdf3dc,#efdcb6);
         border:3px solid #6b4a24; border-radius:18px; color:#4a3418;
         box-shadow: inset 0 2px 0 rgba(255,255,255,.85), inset 0 -3px 0 rgba(140,100,50,.22),
                     0 3px 0 #4d3315, 0 6px 12px rgba(0,0,0,.32); }
  .darkpill{ background:linear-gradient(180deg,rgba(52,38,20,.9),rgba(34,24,12,.94));
             border:3px solid #6b4a24; border-radius:18px; color:#ffeec6;
             box-shadow: inset 0 2px 0 rgba(255,220,160,.18), 0 3px 0 rgba(0,0,0,.35), 0 6px 12px rgba(0,0,0,.35); }
  .btn{ font:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center;
        justify-content:center; gap:2px; transition:transform .07s, filter .12s; white-space:nowrap; }
  .btn:active{ transform:translateY(3px); }
  .btn:disabled{ filter:grayscale(.72) brightness(.82); cursor:default; }
  .btn:focus-visible{ outline:3px solid #ffcf5e; outline-offset:2px; }
  .woodbtn{ background:linear-gradient(180deg,#c99a58,#a2762f 48%,#87621f);
            border:3px solid #55380f; border-radius:16px; color:#fff6e2;
            text-shadow:0 2px 0 rgba(70,44,10,.6);
            box-shadow: inset 0 2px 0 rgba(255,224,168,.4), inset 0 -4px 0 rgba(60,36,8,.35),
                        0 4px 0 #4a300d, 0 7px 12px rgba(0,0,0,.35); }
  .goldbtn{ background:linear-gradient(180deg,#ffe98d,#ffc93c 46%,#eaa716);
            border:3px solid #8a5c05; border-radius:16px; color:#563704;
            text-shadow:0 1px 0 rgba(255,255,255,.55);
            box-shadow: inset 0 3px 0 rgba(255,255,255,.65), inset 0 -5px 0 rgba(150,95,5,.25),
                        0 5px 0 #a97a12, 0 9px 15px rgba(0,0,0,.35); }

  /* ---------- 게임 상단 ---------- */
  #top{ position:absolute; left:0; right:0; top:calc(env(safe-area-inset-top) + 8px);
        display:flex; flex-direction:column; align-items:center; gap:5px; }
  #timer{ font-size:26px; letter-spacing:1px; padding:3px 22px; border-radius:20px;
          color:#ffeec6; background:linear-gradient(180deg,rgba(46,34,16,.86),rgba(28,20,10,.9));
          border:3px solid #7a5528; box-shadow:inset 0 2px 0 rgba(255,220,160,.2), 0 4px 10px rgba(0,0,0,.35); }
  #waveTag{ font-size:12.5px; padding:3px 15px; border-radius:14px; color:#5c3f19;
            background:linear-gradient(180deg,#fdf3dc,#eddcb4); border:3px solid #7a5528;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 3px 7px rgba(0,0,0,.3); }

  .sidecol{ position:absolute; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:11px; }
  .sidecol.l{ left:6px; } .sidecol.r{ right:6px; }
  .sqbtn{ width:70px; height:70px; border-radius:18px; font-size:12.5px; gap:1px; }
  .sqbtn .ic{ width:29px; height:29px; }
  .sqbtn .cost{ font-size:10.5px; display:flex; align-items:center; gap:3px; color:#fff0c8; }
  .sqbtn .cost .ic{ width:13px; height:13px; }

  #bottom{ position:absolute; left:7px; right:7px; bottom:calc(env(safe-area-inset-bottom) + 7px);
           display:flex; flex-direction:column; gap:7px; }
  #ctrlRow{ display:flex; gap:6px; }
  #hpbox{ flex:1; min-width:0; display:flex; align-items:center; gap:8px; padding:6px 11px; }
  #hpbox .ic{ width:22px; height:22px; flex:0 0 22px; }
  #hpwrap{ flex:1; height:17px; border-radius:10px; background:#5c4222;
           border:2px solid #40290f; overflow:hidden; position:relative; }
  #hpfill{ height:100%; width:100%; transition:width .2s;
           background:linear-gradient(180deg,#ff9c88,#e05646 55%,#b8372a); }
  #hptext{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
           font-size:10.5px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.7); }
  .ctrlbtn{ width:54px; flex:0 0 54px; font-size:10px; padding:5px 0 4px; border-radius:16px; }
  .ctrlbtn .ic{ width:20px; height:20px; }
  #statRow{ display:flex; gap:6px; padding:6px 8px; }
  .stat{ flex:1; display:flex; align-items:center; justify-content:center; gap:7px; font-size:15px;
         color:#4a3418; }
  .stat .ic{ width:23px; height:23px; }

  /* ---------- 유닛 정보창 ---------- */
  #unitPop{ position:fixed; z-index:22; display:none; width:190px; padding:9px 9px 8px; border-radius:16px; }
  #unitPop.on{ display:block; animation:popIn .18s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes popIn{ from{ transform:translateY(8px) scale(.9); opacity:0 } }
  #unitPop .un{ font-size:14px; text-align:center; }
  #unitPop .ust{ font-size:10.5px; text-align:center; color:#6b5228; line-height:1.6; margin:4px 0 7px;
                 background:rgba(120,90,40,.13); border-radius:10px; padding:5px 4px; font-weight:700; }
  #unitPop .row{ display:flex; gap:5px; }
  .mini{ flex:1; font:inherit; font-size:10.5px; padding:6px 2px; border-radius:11px; cursor:pointer;
         color:#fff6e2; text-shadow:0 1px 0 rgba(60,36,8,.55); border:2px solid #55380f;
         background:linear-gradient(180deg,#c99a58,#8f6526); display:flex; flex-direction:column;
         align-items:center; line-height:1.3; box-shadow:0 3px 0 rgba(60,36,8,.4); }
  .mini b{ font-size:10px; color:#ffedbe; font-weight:800; }
  .mini:active{ transform:translateY(2px); box-shadow:none; }
  .mini:disabled{ filter:grayscale(.72) brightness(.82); }
  .mini.up{ background:linear-gradient(180deg,#8dc964,#4d8a2c); border-color:#2d5216; }
  .mini.gm{ background:linear-gradient(180deg,#8b7bcd,#54438f); border-color:#2e2453; }
  #popArrow{ position:absolute; width:0; height:0; border-left:9px solid transparent; border-right:9px solid transparent; }

  #toasts{ position:fixed; left:50%; top:13%; transform:translateX(-50%); z-index:76;
           display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none; }
  .toast{ padding:8px 17px; font-size:13.5px; border-radius:20px; color:#fff2d6;
          background:linear-gradient(180deg,rgba(50,36,18,.95),rgba(30,22,11,.96));
          border:2.5px solid #8a6231; box-shadow:0 4px 12px rgba(0,0,0,.4);
          animation:tst 1.7s forwards; }
  @keyframes tst{ 0%{transform:translateY(12px) scale(.9);opacity:0} 12%{transform:none;opacity:1}
                  74%{opacity:1} 100%{transform:translateY(-16px);opacity:0} }

  /* ---------- 모달 ---------- */
  .screen{ position:fixed; inset:0; z-index:92; display:none; align-items:center; justify-content:center; }
  .screen.on{ display:flex; }
  .dim{ background:rgba(24,16,6,.74); padding:16px; }
  .paper{ width:min(352px,93vw); padding:16px 15px 14px; text-align:center; border-radius:20px;
          background:
            radial-gradient(circle at 22% 18%, rgba(255,255,255,.5), transparent 46%),
            linear-gradient(180deg,#fbf0d6,#ecd9ae);
          border:4px solid #6b4a24;
          box-shadow: inset 0 0 0 3px rgba(255,255,255,.4), inset 0 -6px 16px rgba(160,120,60,.2),
                      0 10px 26px rgba(0,0,0,.45);
          animation:mIn .24s cubic-bezier(.2,.9,.3,1.25); position:relative; }
  @keyframes mIn{ from{ transform:translateY(16px) scale(.93); opacity:0 } }
  .paper::before,.paper::after{ content:""; position:absolute; width:9px; height:9px; border-radius:50%;
    background:radial-gradient(circle at 32% 30%, #fff5d8, #8a6231 62%, #4d3315);
    box-shadow:0 1px 2px rgba(0,0,0,.35); }
  .paper::before{ left:10px; top:10px; } .paper::after{ right:10px; top:10px; }
  .ribbon{ display:inline-block; margin:-30px auto 10px; padding:7px 26px; font-size:17px; color:#fff6e2;
           border-radius:12px; border:3px solid #2a5c8f; text-shadow:0 2px 0 rgba(20,50,80,.6);
           background:linear-gradient(180deg,#5fa8e0,#2f7dbe);
           box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 4px 0 #245f92, 0 7px 12px rgba(0,0,0,.3); }
  .paper .btn{ width:100%; padding:12px; font-size:15px; margin-top:9px; border-radius:14px; }
  .rowbtns{ display:flex; gap:9px; } .rowbtns .btn{ flex:1; }
  .lrow{ display:flex; align-items:center; gap:10px; padding:9px 11px; margin-bottom:7px;
         border-radius:14px; border:3px solid #b9945c; background:rgba(255,250,235,.62); cursor:pointer; }
  .lrow.sel{ border-color:#e8a71c; background:rgba(255,226,150,.85); }
  .lrow .ic{ width:24px; height:24px; flex:0 0 24px; }
  .lrow .nm{ flex:1; text-align:left; font-size:13.5px; }
  .lrow .nm small{ display:block; font-size:10.5px; color:#7d6234; font-weight:700; margin-top:1px; }
  .lrow .cs{ font-size:12.5px; color:#8a5e12; min-width:62px; text-align:right; display:flex;
             align-items:center; justify-content:flex-end; gap:4px; }
  .lrow .cs .ic{ width:14px; height:14px; flex:0 0 14px; }
  #drawResult{ min-height:22px; font-size:13.5px; margin:6px 0 3px; color:#8a5e12; }

  /* ---------- 메인 / 결과 ---------- */
  .board{ position:fixed; inset:0; z-index:62; display:none; flex-direction:column;
          transition:transform .44s cubic-bezier(.3,.85,.3,1), opacity .3s; }
  .board.on{ display:flex; }
  .board.slideUp{ transform:translateY(-104%); opacity:.25; }
  #mainScreen{ background:linear-gradient(180deg,#4a7b34,#2f5624); }
  #mapWrap{ position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  #mapCv{ display:block; width:100%; }
  #nodeLayer{ position:absolute; left:0; top:0; width:100%; }
  .rewardBtn{ position:absolute; transform:translate(-50%,0); padding:6px 13px; font-size:12px;
              border-radius:14px; border:3px solid #8a5c05; cursor:pointer; color:#563704;
              background:linear-gradient(180deg,#ffe98d,#f0b62a); font-weight:800;
              box-shadow:0 4px 0 #a97a12, 0 6px 10px rgba(0,0,0,.35); animation:bnc 1.4s ease-in-out infinite; }
  .rewardBtn:active{ transform:translate(-50%,3px); box-shadow:0 1px 0 #a97a12; }
  @keyframes bnc{ 50%{ transform:translate(-50%,-5px) } }

  .hud{ position:absolute; z-index:6; display:flex; align-items:center; gap:8px; padding:7px 14px; font-size:15px; }
  .hud.l{ left:12px; top:calc(env(safe-area-inset-top) + 12px); }
  .hud.r{ right:12px; top:calc(env(safe-area-inset-top) + 12px); flex-direction:column; gap:2px;
          font-size:11.5px; padding:7px 11px; cursor:pointer; }
  .hud .ic{ width:22px; height:22px; }
  .hud.r .ic{ width:25px; height:25px; }
  #btnShop{ position:absolute; z-index:6; left:12px; top:calc(env(safe-area-inset-top) + 64px);
            width:68px; height:68px; border-radius:18px; font-size:12px; }
  #btnShop .ic{ width:27px; height:27px; }
  #titleBar{ position:absolute; z-index:6; left:50%; transform:translateX(-50%);
             top:calc(env(safe-area-inset-top) + 8px); }
  .titlecard{ padding:10px 26px 8px; border-radius:14px; border:5px solid #6b4a24;
              background:linear-gradient(180deg,#ffe98d,#ffc93c 55%,#eaa716);
              box-shadow: inset 0 3px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(140,90,10,.3),
                          0 6px 14px rgba(0,0,0,.4); text-align:center; }
  .titlecard .t{ font-size:25px; letter-spacing:1px; color:#5c3a08; text-shadow:0 2px 0 rgba(255,255,255,.4); }
  .titlecard .v{ font-size:10.5px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.5); margin-top:1px; }

  /* ---------- 인증 화면 ---------- */
  #authScreen{ background:linear-gradient(180deg,#3f6f31,#2c5624); align-items:center; justify-content:center; z-index:70; }
  #authCard{ width:min(320px,86vw); padding:22px 22px 24px; border-radius:22px;
             background:radial-gradient(circle at 25% 15%, rgba(255,255,255,.5), transparent 48%),
                        linear-gradient(180deg,#fbf0d6,#ecd9ae);
             border:4px solid #6b4a24; text-align:center;
             box-shadow: inset 0 0 0 3px rgba(255,255,255,.4), 0 12px 28px rgba(0,0,0,.45); }
  #authCard .titlecard{ margin-bottom:22px; display:inline-block; }
  #authBtns{ display:flex; flex-direction:column; gap:10px; }
  #authBtns .btn{ padding:13px; font-size:16px; border-radius:15px; }
  #authPlayWrap{ display:none; }
  #authPlayWrap #btnAuthPlay{ width:100%; height:58px; }

  #authModal{ position:fixed; inset:0; z-index:88; display:none; align-items:flex-start; justify-content:center;
              background:rgba(10,16,6,.5); padding-top:16vh; }
  #authModal.on{ display:flex; }
  .amBox{ width:min(320px,88vw); padding:20px 18px 18px; border-radius:22px;
          background:linear-gradient(180deg,#fbf0d6,#ecd9ae); border:4px solid #6b4a24;
          transform:translateY(-140%); transition:transform .38s cubic-bezier(.25,.85,.3,1.15);
          box-shadow:0 14px 30px rgba(0,0,0,.5); }
  #authModal.on .amBox{ transform:translateY(0); }
  .amBox h3{ margin:0 0 16px; font-size:19px; color:#4a3418; text-align:center; }
  .amField{ margin-bottom:14px; }
  .amLabel{ font-size:11.5px; color:#6b5228; margin:0 0 5px 4px; text-align:left; }
  .amPill{ width:100%; box-sizing:border-box; padding:12px 16px; border-radius:24px;
           border:2.5px solid #1b1b1b; background:rgba(10,10,10,.72); color:#fff;
           font:inherit; font-size:14.5px; outline:none; }
  .amPill::placeholder{ color:rgba(255,255,255,.4); }
  .amPill.bad{ color:#ff8a78; }
  .amWarn{ font-size:10.5px; color:#ff6b5a; margin:5px 0 0 4px; text-align:left; min-height:13px; }
  .amBox .btn{ width:100%; padding:12px; font-size:15px; margin-top:6px; border-radius:16px; }
  .amClose{ text-align:center; font-size:12px; color:#6b5228; margin-top:10px; cursor:pointer; text-decoration:underline; }

  #playBar{ position:absolute; z-index:6; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 14px);
            display:flex; flex-direction:column; align-items:center; gap:10px; }
  #btnPlay{ width:206px; height:64px; border-radius:20px; font:inherit; font-size:26px; letter-spacing:3px;
            cursor:pointer; border:4px solid #8a5c05; color:#563704; font-weight:800;
            background:linear-gradient(180deg,#ffef9c 0%,#ffcd42 44%,#eeab17 100%);
            text-shadow:0 1px 0 rgba(255,255,255,.6);
            box-shadow: inset 0 4px 0 rgba(255,255,255,.7), inset 0 -6px 0 rgba(150,95,5,.2),
                        0 6px 0 #a97a12, 0 11px 18px rgba(0,0,0,.4); }
  #btnPlay:active{ transform:translateY(5px); box-shadow: inset 0 4px 0 rgba(255,255,255,.6), 0 1px 0 #a97a12; }
  #diffRow{ display:flex; gap:7px; }
  .dbtn{ font:inherit; font-size:12.5px; padding:8px 14px; border-radius:14px; cursor:pointer;
         color:#fff6e2; border:3px solid #55380f; background:linear-gradient(180deg,#a2762f,#7a5420);
         box-shadow:0 4px 0 #4a300d; text-shadow:0 1px 0 rgba(50,30,6,.6); }
  .dbtn.sel{ background:linear-gradient(180deg,#8dc964,#4a8629); border-color:#2d5216; box-shadow:0 4px 0 #2d5216; }
  .dbtn.lock{ filter:grayscale(.85) brightness(.66); }
  .dbtn:active{ transform:translateY(3px); box-shadow:none; }

  /* 결과 */
  #endScreen{ background:rgba(24,16,6,.72); align-items:center; justify-content:center; padding:20px; }
  #endPanel{ width:min(340px,90vw); }
  #endPanel.drop{ animation:dropIn 1.05s cubic-bezier(.3,.6,.4,1) both; }
  @keyframes dropIn{
    0%{ transform:translateY(-118vh) rotate(-3deg) }
    46%{ transform:translateY(0) rotate(0deg) }
    58%{ transform:translateY(-34px) rotate(1.4deg) }
    70%{ transform:translateY(0) rotate(0deg) }
    79%{ transform:translateY(-14px) rotate(-.8deg) }
    88%{ transform:translateY(0) }
    94%{ transform:translateY(-5px) }
    100%{ transform:translateY(0) }
  }
  .statBox{ background:rgba(255,252,240,.7); border:3px solid #c4a066; border-radius:14px;
            padding:8px 10px; margin:8px 0; }
  .statBox .lb{ font-size:11px; color:#8a7040; }
  .statBox .vl{ font-size:23px; color:#4a3418; letter-spacing:1px; }
  .duo{ display:flex; gap:9px; } .duo > div{ flex:1; }

  /* 커튼 */
  #curtain{ position:fixed; inset:0; z-index:96; display:none; align-items:center; justify-content:center;
            transform:translateY(100%); transition:transform .52s cubic-bezier(.3,.85,.3,1);
            background:
              radial-gradient(circle at 50% 40%, #f8ecd0, #e3cea3 62%, #cdb381 100%); }
  #curtain.on{ display:flex; transform:translateY(0); }
  #curtain.up{ transform:translateY(-100%); }
  .plankBox{ position:relative; padding:30px 34px; border-radius:16px;
             background:
               repeating-linear-gradient(93deg, rgba(90,58,20,.14) 0 3px, rgba(255,225,170,.1) 3px 10px),
               linear-gradient(180deg,#c1934f,#a3762f 50%,#87611f);
             border:5px solid #4f3410;
             box-shadow: inset 0 3px 0 rgba(255,228,175,.35), inset 0 -8px 18px rgba(50,30,6,.35),
                         0 10px 24px rgba(0,0,0,.35);
             animation:ctIn .55s cubic-bezier(.2,.9,.3,1.25) both; }
  @keyframes ctIn{ from{ transform:scale(.86) translateY(18px); opacity:0 } }
  .nail{ position:absolute; width:13px; height:13px; border-radius:50%;
         background:radial-gradient(circle at 33% 30%, #fff4d6, #a07a3a 55%, #4d3315);
         box-shadow:0 2px 3px rgba(0,0,0,.45), inset 0 -1px 1px rgba(0,0,0,.3); }
  .nail.a{ left:9px; top:9px } .nail.b{ right:9px; top:9px }
  .nail.c{ left:9px; bottom:9px } .nail.d{ right:9px; bottom:9px }
  .noteP{ padding:20px 26px; border-radius:5px; transform:rotate(-1.2deg);
          background:
            radial-gradient(circle at 25% 15%, rgba(255,255,255,.65), transparent 50%),
            linear-gradient(180deg,#fdf6e2,#f0e2c2);
          border:1px solid #d8c396;
          box-shadow: 0 4px 10px rgba(40,22,4,.35), inset 0 0 22px rgba(190,160,110,.28); }
  .noteP .tx{ font-size:20px; color:#5b4220; letter-spacing:.5px; line-height:1.6; }

  /* 소환 연출 */
  #summonFx{ position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
             background:radial-gradient(circle at 50% 45%, rgba(255,244,200,.28), rgba(10,14,6,.8) 62%); }
  #summonFx.on{ display:flex; animation:fxIn .28s ease-out; }
  #summonFx.out{ animation:fxOut .34s forwards; }
  @keyframes fxIn{ from{ opacity:0 } }
  @keyframes fxOut{ to{ opacity:0; transform:scale(1.07) } }
  .fxRay{ position:absolute; width:360px; height:360px; border-radius:50%; opacity:.5;
          background:conic-gradient(from 0deg, rgba(255,240,180,.55) 0 5deg, transparent 5deg 30deg,
                     rgba(255,240,180,.3) 30deg 34deg, transparent 34deg 60deg);
          animation:fxSpin 7s linear infinite; }
  @keyframes fxSpin{ to{ transform:rotate(360deg) } }
  .fxBox{ position:relative; text-align:center; animation:fxPop .45s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes fxPop{ from{ transform:scale(.5) translateY(22px); opacity:0 } }
  .fxBox canvas{ width:206px; height:206px; filter:drop-shadow(0 0 20px rgba(255,240,180,.8)); }
  #fxName{ font-size:22px; margin-top:-8px; text-shadow:0 3px 0 rgba(0,0,0,.5); }

  /* 가로 룰렛 카드 */
  .rrow{ display:flex; gap:8px; margin-bottom:6px; }
  .rcard{ flex:1; border-radius:15px; padding:10px 4px 8px; cursor:pointer;
          border:3px solid rgba(0,0,0,.25); color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.4);
          box-shadow:0 4px 0 rgba(0,0,0,.25); transition:transform .08s; }
  .rcard:active{ transform:translateY(2px); }
  .rcard .rt{ font-size:14px; } .rcard .rp{ font-size:11px; opacity:.9; margin-top:2px; }
  .rcard .rc{ font-size:11.5px; margin-top:6px; display:flex; align-items:center;
              justify-content:center; gap:3px; background:rgba(0,0,0,.25); border-radius:10px; padding:3px 0; }
  .rcard .rc .ic{ width:13px; height:13px; }
  .rcard.hero{ background:linear-gradient(180deg,#b98ce8,#6d3fb0); border-color:#43206e; }

function resize(){

  cvEl.width=CW*dpr; cvEl.height=CH*dpr;

function buildGeometry(){
  const SIDE=84,TOPUI=112,BOTUI=132,CASTLE_SP=54;
  const ax0=SIDE, ax1=CW-SIDE, ay0=TOPUI+CASTLE_SP, ay1=CH-BOTUI;
  const F=Math.max(180,Math.min(ax1-ax0,ay1-ay0));
  const cx=(ax0+ax1)/2-10, cy=ay0+(ay1-ay0)/2-18;   // 왼쪽·위로 살짝
  const pw=F*0.108;
  const x1=cx-F/2+pw/2, x2=cx+F/2-pw/2, y1=cy-F/2+pw/2, y2=cy+F/2-pw/2;
  const caveY=y1+F*0.10;
  G={pw,x1,y1,x2,y2,cx,cy,F,caveY,
     segA:(y2-caveY),segB:(x2-x1),segC:(y2-y1),segD:(x2-x1)};
  G.total=G.segA+G.segB+G.segC+G.segD;
  const box=(F-pw*2)*0.94, gap=box*0.03, cs=(box-gap*(GRID_N-1))/GRID_N;
  const gx=cx-box/2, gy=cy-box/2;
  CELLS=[];
  for(let i=0;i<MAX_UNIT;i++){
    const col=i%GRID_N,row=(i/GRID_N)|0;
    CELLS.push({x:gx+col*(cs+gap),y:gy+row*(cs+gap),s:cs,
                cx:gx+col*(cs+gap)+cs/2,cy:gy+row*(cs+gap)+cs/2});
  }
  G.box=box; G.gx=gx; G.gy=gy; G.gap=gap;
  TREES=makeForest(CW,CH,{x1,y1,x2,y2,pw},5150);
}
function makeForest(w,h,ex,seed0){
  let seed=seed0;
  const rnd=()=>(seed=(seed*1103515245+12345)%2147483648)/2147483648;
  const out=[],sp=30;
  for(let ry=-6;ry<h+34;ry+=sp){
    for(let rx=-6;rx<w+34;rx+=sp){
      const x=rx+(rnd()-.5)*11, y=ry+(rnd()-.5)*11;
      if(ex){ const pad=ex.pw*1.0;
        if(x>ex.x1-pad&&x<ex.x2+pad&&y>ex.y1-pad&&y<ex.y2+pad) continue; }
      out.push({x,y,r:19+rnd()*3,v:rnd(),lean:(rnd()-.5)*.1,b:rnd()});
    }
  }
  out.sort((a,b)=>a.y-b.y);
  return out;
}
function pathPos(d){
  const {x1,y1,x2,y2,caveY,segA,segB,segC}=G;
  if(d<segA) return {x:x1,y:caveY+d};
  d-=segA; if(d<segB) return {x:x1+d,y:y2};
  d-=segB; if(d<segC) return {x:x2,y:y2-d};
  d-=segC; return {x:x2-d,y:y1};
}

/* =========================================================
   업데이트
========================================================= */
function update(dt){
  if(!playing||S.over||paused) return;
  if(S.toSpawn>0){
    S.spawnTimer-=dt;
    if(S.spawnTimer<=0){ spawnMonster(); S.toSpawn--;
      S.spawnTimer=Math.max(.32,1.05-S.stage*0.006); }
  } else if(!S.cleared&&S.monsters.length===0){
    S.cleared=true; S.clearDelay=0; S.gold+=25+S.stage*6;
    if(meta.best[S.diff]<S.stage){ meta.best[S.diff]=S.stage; saveMeta(); }
    if(S.stage>=MAX_STAGE){ endGame(true); return; }
    syncUI();
  }
  if(S.cleared&&!wheelPending){ S.clearDelay+=dt; if(S.clearDelay>1.1) nextStage(); }

  for(let i=S.monsters.length-1;i>=0;i--){
    const m=S.monsters[i];
    m.d+=m.speed*dt; m.wob+=dt*7.5;
    if(m.hit>0) m.hit=Math.max(0,m.hit-dt*5);
    if(m.fire>0) m.fire=Math.max(0,m.fire-dt*1.6);
    if(m.boss&&m.B.unitKill){ m.atkT-=dt; if(m.atkT<=0){ m.atkT=3.5; bossStrike(m); } }
    if(m.d>=G.total){
      S.castleHP-=m.dmg; S.monsters.splice(i,1);
      pop(G.x1,G.y1-G.pw*1.7,"-"+m.dmg,"#ff8878");
      if(S.castleHP<=0){ S.castleHP=0; endGame(false); return; }
      syncUI();
    }
  }
  for(let i=0;i<MAX_UNIT;i++){
    const u=S.cells[i]; if(!u) continue;
    const cell=CELLS[i];
    u.cd-=dt;
    if(u.anim>0) u.anim=Math.max(0,u.anim-dt*2);
    if(u.lunge>0) u.lunge=Math.max(0,u.lunge-dt*5);
    if(u.cd>0) continue;
    const range=unitRange(u,cell.s);
    let best=null,bd=1e9,bx=0,by=0;
    for(const m of S.monsters){
      const p=pathPos(m.d), dd=Math.hypot(p.x-cell.cx,p.y-cell.cy);
      if(dd<=range&&dd<bd){ bd=dd; best=m; bx=p.x; by=p.y; }
    }
    if(!best) continue;
    u.cd=1/unitRate(u); u.lunge=1;
    const len=Math.max(1,bd); u.lx=(bx-cell.cx)/len; u.ly=(by-cell.cy)/len;
    best.hp-=unitDmg(u); best.hit=1;
    fire(u,cell,bx,by);
    if(best.hp<=0){
      const k=S.monsters.indexOf(best); if(k>=0) S.monsters.splice(k,1);
      S.gold+=best.gold; S.coin+=best.coin; S.kills++;
      burst(bx,by,best.boss?"#ffd463":"#8fd67a",best.boss?28:9);
      pop(bx,by,"+"+best.gold,"#ffdf9e");
      if(best.boss){ S.gem+=6; pop(bx,by-18,"보석 +6","#9fd8ff");
        if(BOSS[S.stage]) setTimeout(()=>{ if(playing&&!S.over) openWheel(S.stage); },700); }
      else if(Math.random()<0.02){ S.gem++; pop(bx,by-18,"보석 +1","#9fd8ff"); }
      syncUI();
    }
  }
  for(let i=S.shots.length-1;i>=0;i--) if((S.shots[i].t-=dt)<=0) S.shots.splice(i,1);
  for(let i=S.projs.length-1;i>=0;i--){
    const p=S.projs[i]; p.t+=dt; p.spin+=dt*13;
    const k=Math.min(1,p.t/p.dur);
    p.x=p.sx+(p.tx-p.sx)*k; p.y=p.sy+(p.ty-p.sy)*k-Math.sin(k*Math.PI)*p.arc;
    if(k>=1){
      for(let j=0;j<4;j++){ const a=Math.random()*6.28,sp=30+Math.random()*60;
        S.parts.push({x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:.22,color:p.c,r:1.5}); }
      S.projs.splice(i,1);
    }
  }
  for(let i=S.pops.length-1;i>=0;i--){ const p=S.pops[i]; p.t-=dt; p.y-=dt*26; if(p.t<=0) S.pops.splice(i,1); }
  for(let i=S.parts.length-1;i>=0;i--){ const p=S.parts[i];
    p.t-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=260*dt; if(p.t<=0) S.parts.splice(i,1); }
}
const PROJ={archer:"arrow",stone:"stone",cannon:"ball",mage:"orb",priest:"orb"};
function fire(u,cell,bx,by){
  const k=PROJ[u.type], T=TIERS[u.tier];
  if(!k){ S.shots.push({x1:cell.cx,y1:cell.cy,x2:bx,y2:by,t:.13,c:T.glow,w:3}); return; }
  const dist=Math.hypot(bx-cell.cx,by-cell.cy);
  S.projs.push({k,sx:cell.cx,sy:cell.cy,x:cell.cx,y:cell.cy,tx:bx,ty:by,t:0,
    dur:Math.max(.1,dist/780),spin:0,
    arc:(k==="stone"?dist*.16:(k==="ball"?dist*.1:0)),c:T.glow,c2:T.rim});
}
function bossStrike(m){
  const idx=[]; S.cells.forEach((c,i)=>{ if(c) idx.push(i); });
  if(!idx.length) return;
  const i=idx[(Math.random()*idx.length)|0], c=CELLS[i], p=pathPos(m.d);
  m.fire=.6;
  S.shots.push({x1:p.x,y1:p.y,x2:c.cx,y2:c.cy,t:.3,c:"#ffa32a",w:9});

========================================================= */
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill(); }
function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function blob(x,y,r,n,jag,seed){
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const a=i/n*6.2832;
    const rr=r*(1+Math.sin(a*3+seed)*jag*.5+Math.sin(a*5+seed*2)*jag*.3);
    const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr*.94;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
}
function hexA(h,a){ const n=parseInt(h.slice(1),16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")"; }
function shade(h,p){ const n=parseInt(h.slice(1),16),f=v=>Math.max(0,Math.min(255,v+p));
  return "rgb("+f((n>>16)&255)+","+f((n>>8)&255)+","+f(n&255)+")"; }
const OL="#1e2b16";           // 공통 외곽선

/* ---------- 나무 (참고 사진 스타일) ---------- */
const LEAF=[
 ["#2f6a2c","#3f8a35","#57a943"],["#2a5f2b","#397e33","#4f9c40"],
 ["#356f2a","#468f33","#5eb046"],["#27582a","#356f31","#48903c"],
 ["#316327","#428133","#59a042"],
];
function drawTree(t){
  const r=t.r,x=t.x,y=t.y,p=LEAF[(t.v*LEAF.length)|0];
  ctx.fillStyle="rgba(20,40,16,.2)";
  ctx.beginPath(); ctx.ellipse(x,y+r*.66,r*.6,r*.16,0,0,6.2832); ctx.fill();
  ctx.save(); ctx.translate(x,y); ctx.rotate(t.lean);
  // 줄기
  ctx.fillStyle=OL; roundRect(-r*.115,-r*.05,r*.23,r*.72,r*.08); ctx.fill();
  ctx.fillStyle="#5a3f1e"; roundRect(-r*.085,-r*.03,r*.17,r*.66,r*.06); ctx.fill();
  ctx.fillStyle="#6f4f26"; roundRect(-r*.085,-r*.03,r*.07,r*.66,r*.04); ctx.fill();
  // 수관 외곽
  ctx.fillStyle=OL;
  circle(0,-r*.3,r*.76); circle(-r*.4,-r*.06,r*.5); circle(r*.42,-r*.14,r*.47);
  // 잎
  ctx.fillStyle=p[0];
  circle(0,-r*.3,r*.68); circle(-r*.38,-r*.06,r*.43); circle(r*.4,-r*.14,r*.4);
  ctx.fillStyle=p[1];
  circle(-r*.1,-r*.42,r*.46); circle(r*.24,-r*.3,r*.34); circle(-r*.34,-r*.16,r*.28);
  ctx.fillStyle=p[2];
  circle(-r*.22,-r*.54,r*.26); circle(r*.06,-r*.58,r*.19);
  ctx.fillStyle="rgba(255,255,255,.13)"; circle(-r*.28,-r*.6,r*.14);
  if(t.b>.9){ ctx.fillStyle="#e8c34a"; circle(r*.3,-r*.34,r*.13);
              ctx.fillStyle="#f5df8e"; circle(r*.26,-r*.4,r*.06); }

   게임 렌더
========================================================= */
let TT=0;
function draw(){
  if(!G||!S) return;
  ctx=mainCtx;
  const g=ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,"#4d8137"); g.addColorStop(.5,"#3e6f2d"); g.addColorStop(1,"#325c26");
  ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH);
  ctx.globalAlpha=.05;
  for(let y=0;y<CH;y+=18){ ctx.fillStyle=(y/18)%2?"#1a3b14":"#6fa353"; ctx.fillRect(0,y,CW,9); }
  ctx.globalAlpha=1;
  for(const t of TREES) drawTree(t);
  drawTrack(); drawPlatform();
  for(let i=0;i<MAX_UNIT;i++){
    if(drag&&drag.from===i&&drag.moved) continue;
    if(S.cells[i]) drawUnit(CELLS[i],S.cells[i]);
  }
  for(const m of S.monsters) drawMonster(m);
  for(const s of S.shots){
    ctx.globalAlpha=Math.max(0,s.t/.25);
    ctx.strokeStyle=s.c; ctx.lineWidth=s.w; ctx.lineCap="round";
    ctx.shadowColor=s.c; ctx.shadowBlur=9;
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
  for(const p of S.projs) drawProj(p);
  for(const p of S.parts){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.t*2)); ctx.fillStyle=p.color; circle(p.x,p.y,p.r); ctx.globalAlpha=1;
  }
  drawCave(); drawCastle();
  if(drag&&drag.moved&&drag.unit){
    ctx.save(); ctx.globalAlpha=.94;
    drawUnitBody(drag.x,drag.y-CELLS[0].s*.22,CELLS[0].s*1.12,drag.unit,false);
    ctx.restore();
  }
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(const p of S.pops){
    ctx.globalAlpha=Math.min(1,p.t);
    ctx.font="bold 14px system-ui"; ctx.lineWidth=3.5; ctx.strokeStyle="rgba(20,14,4,.7)";
    ctx.strokeText(p.text,p.x,p.y); ctx.fillStyle=p.color; ctx.fillText(p.text,p.x,p.y);
    ctx.globalAlpha=1;
  }
}
function strokeLoop(){
  ctx.beginPath(); ctx.moveTo(G.x1,G.y1); ctx.lineTo(G.x2,G.y1);
  ctx.lineTo(G.x2,G.y2); ctx.lineTo(G.x1,G.y2); ctx.closePath(); ctx.stroke();
}
function drawTrack(){
  const {pw,x1,y1,x2,y2}=G;
  ctx.lineJoin="round"; ctx.lineCap="round";
  ctx.strokeStyle="#22461c"; ctx.lineWidth=pw+12; strokeLoop();
  ctx.strokeStyle="#8fbe5c"; ctx.lineWidth=pw+8; strokeLoop();
  ctx.strokeStyle="#6f4d24"; ctx.lineWidth=pw+3; strokeLoop();
  const gr=ctx.createLinearGradient(0,y1,0,y2);
  gr.addColorStop(0,"#d6b476"); gr.addColorStop(.5,"#c7a262"); gr.addColorStop(1,"#b89154");
  ctx.strokeStyle=gr; ctx.lineWidth=pw-1; strokeLoop();
  ctx.save();
  ctx.strokeStyle="rgba(255,246,214,.16)"; ctx.lineWidth=pw*.24;
  ctx.beginPath(); ctx.moveTo(x1,y2-pw*.3); ctx.lineTo(x1,y1); ctx.lineTo(x2-pw*.3,y1); ctx.stroke();
  ctx.restore();
  ctx.fillStyle="rgba(120,86,40,.2)";
  const per=2*((x2-x1)+(y2-y1));
  for(let i=0;i<90;i++){
    const d=(i*91.7)%per; let px,py;
    if(d<(x2-x1)){ px=x1+d; py=y1; }
    else if(d<(x2-x1)+(y2-y1)){ px=x2; py=y1+(d-(x2-x1)); }
    else if(d<2*(x2-x1)+(y2-y1)){ px=x2-(d-(x2-x1)-(y2-y1)); py=y2; }
    else{ px=x1; py=y2-(d-2*(x2-x1)-(y2-y1)); }
    const off=((i*43)%100)/100-.5;
    circle(px+off*pw*.5,py+off*pw*.5,1.3+((i*19)%3)*.5);
  }
}
function drawPlatform(){
  const pad=G.gap*2.0,x=G.gx-pad,y=G.gy-pad,w=G.box+pad*2,h=G.box+pad*2;
  ctx.fillStyle="rgba(20,40,16,.28)"; roundRect(x+2,y+5,w,h,20); ctx.fill();
  const pg=ctx.createLinearGradient(0,y,0,y+h);
  pg.addColorStop(0,"#7fb050"); pg.addColorStop(.5,"#6da043"); pg.addColorStop(1,"#5c8c38");
  ctx.fillStyle=pg; roundRect(x,y,w,h,20); ctx.fill();
  ctx.strokeStyle="#3a6425"; ctx.lineWidth=4; roundRect(x,y,w,h,20); ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.16)"; ctx.lineWidth=2; roundRect(x+4,y+4,w-8,h-8,17); ctx.stroke();
  // 잔디 얼룩
  ctx.fillStyle="rgba(255,255,255,.05)";
  for(let i=0;i<16;i++){
    const px=x+((i*97)%(w-20))+10, py=y+((i*53)%(h-20))+10;
    ctx.beginPath(); ctx.ellipse(px,py,9,4,i,0,6.2832); ctx.fill();
  }
  // 드래그 중일 때만 슬롯 표시
  if(drag&&drag.moved){
    for(let i=0;i<MAX_UNIT;i++){
      const c=CELLS[i], hov=drag.over===i;
      ctx.fillStyle=hov?"rgba(255,238,180,.3)":"rgba(30,60,22,.2)";
      roundRect(c.x,c.y,c.s,c.s,12); ctx.fill();
      ctx.setLineDash(hov?[]:[6,5]);
      ctx.strokeStyle=hov?"#ffe08a":"rgba(255,255,255,.45)";
      ctx.lineWidth=hov?3.4:2.2;
      if(hov){ ctx.shadowColor="#ffe08a"; ctx.shadowBlur=16; }
      roundRect(c.x,c.y,c.s,c.s,12); ctx.stroke();
      ctx.shadowBlur=0; ctx.setLineDash([]);
    }
  }
  // 선택 표시
  if(S.selected>=0&&S.cells[S.selected]){
    const c=CELLS[S.selected],u=S.cells[S.selected];
    ctx.strokeStyle="rgba(255,224,138,.55)"; ctx.lineWidth=2.4; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.arc(c.cx,c.cy,unitRange(u,c.s),0,6.2832); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle="#ffe08a"; ctx.lineWidth=3; ctx.shadowColor="#ffe08a"; ctx.shadowBlur=14;
    roundRect(c.x,c.y,c.s,c.s,12); ctx.stroke(); ctx.shadowBlur=0;
  }
}

function drawMonster(m){
  const p=pathPos(m.d),r=m.r,T=MT[m.t];

  ctx.beginPath(); ctx.ellipse(p.x,p.y+r*.94,r*.76,r*.2,0,0,6.2832); ctx.fill();

  else if(T.draw==="dragon") drawDragonM(p,r,m,T);
  else drawHumanM(p,r,m,T);
  ctx.restore();
  const bw=r*1.7,bh=Math.max(4,r*.16);

  ctx.fillStyle=hg;
  roundRect(p.x-bw/2,p.y-r*1.5,bw*Math.max(0,m.hp/m.maxhp),bh,bh/2); ctx.fill();
  if(m.boss){
    ctx.font="bold "+Math.max(10,r*.28)+"px system-ui";

  }

function drawSlimeM(p,r,m,T){
  const t=m.wob,x=p.x,y=p.y-r*.06;

    ctx.fillStyle=hexA(T.c2,.7);

    for(let i=0;i<3;i++){
      const x0=x+r-2*r*(i/3),x1=x+r-2*r*((i+1)/3),mid=(x0+x1)/2;
      const d=r*(dp[i]+Math.sin(t+i*1.9)*.1);
      ctx.quadraticCurveTo(mid,y+r*.42+d*2.15,x1,y+r*.42);
    }
    ctx.closePath();
  };
  path(); ctx.fillStyle=shade(T.c3,-40); ctx.fill();
  ctx.save(); path(); ctx.clip();
  const gg=ctx.createRadialGradient(x-r*.3,y-r*.44,r*.05,x,y+r*.22,r*1.3);
  gg.addColorStop(0,T.c1); gg.addColorStop(.5,T.c2); gg.addColorStop(1,T.c3);

  ctx.fillStyle="rgba(255,255,255,.13)";
  ctx.beginPath(); ctx.ellipse(x,y+r*.8,r*.9,r*.32,0,0,6.2832); ctx.fill();
  // 안쪽 기포
  ctx.fillStyle=hexA(T.c1,.35);
  circle(x-r*.42,y+r*.2,r*.1); circle(x+r*.44,y-r*.02,r*.075); circle(x+r*.1,y+r*.5,r*.06);
  ctx.restore();
  ctx.fillStyle="rgba(255,255,255,.45)";
  ctx.beginPath(); ctx.ellipse(x-r*.36,y-r*.46,r*.2,r*.1,-.55,0,6.2832); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.24)"; circle(x-r*.54,y-r*.24,r*.07);
  // 무표정 눈
  ctx.fillStyle="#16321c";
  ctx.beginPath(); ctx.ellipse(x-r*.27,y-r*.1,r*.115,r*.155,0,0,6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+r*.27,y-r*.1,r*.115,r*.155,0,0,6.2832); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.75)";
  circle(x-r*.3,y-r*.16,r*.042); circle(x+r*.24,y-r*.16,r*.042);
  ctx.strokeStyle="rgba(22,50,28,.8)"; ctx.lineWidth=Math.max(1,r*.055);

  ctx.quadraticCurveTo(x+r*.6,y-r*.5,x+r*.54,y+r*.82); ctx.closePath(); ctx.fill();
  // 종유석

function drawCastle(){
  const s=40, cx=G.x1+s*.1, cy=G.y1-G.pw*.6-s*.62;
  ctx.lineJoin="round";
  ctx.fillStyle="rgba(20,40,16,.3)";
  ctx.beginPath(); ctx.ellipse(cx,cy+s*.78,s*.95,s*.16,0,0,6.2832); ctx.fill();
  const stone=(x,y,w,h)=>{
    ctx.fillStyle="#5d5b57"; roundRect(x-1.5,y-1.5,w+3,h+3,5); ctx.fill();
    const g=ctx.createLinearGradient(x,0,x+w,0);
    g.addColorStop(0,"#ded9cd"); g.addColorStop(.45,"#c2bcae"); g.addColorStop(1,"#96907f");
    ctx.fillStyle=g; roundRect(x,y,w,h,4); ctx.fill();
    ctx.strokeStyle="rgba(90,84,70,.3)"; ctx.lineWidth=1;
    for(let i=1;i*11<h;i++){ ctx.beginPath(); ctx.moveTo(x,y+i*11); ctx.lineTo(x+w,y+i*11); ctx.stroke(); }
    for(let i=1;i*11<h;i++){
      const off=(i%2)*8;
      for(let k=0;k*15+off<w;k++){ ctx.beginPath();
        ctx.moveTo(x+k*15+off,y+(i-1)*11); ctx.lineTo(x+k*15+off,y+i*11); ctx.stroke(); }
    }
  };
  const merlon=(x,y,w)=>{
    ctx.fillStyle="#5d5b57"; roundRect(x-1.5,y-1.5,w+3,s*.2+3,4); ctx.fill();
    ctx.fillStyle="#cfc9bb"; roundRect(x,y,w,s*.18,3); ctx.fill();
    const n=Math.max(2,Math.round(w/(s*.16)));
    ctx.fillStyle="#5d5b57";
    for(let i=0;i<n;i++){ const bx=x+i*(w/n)+w/n*.28;
      roundRect(bx-1.2,y-s*.15-1.2,w/n*.44+2.4,s*.16+2.4,3); ctx.fill(); }
    ctx.fillStyle="#dcd6c8";
    for(let i=0;i<n;i++){ const bx=x+i*(w/n)+w/n*.28;
      roundRect(bx,y-s*.15,w/n*.44,s*.16,2.5); ctx.fill(); }
  };
  // 좌우 탑
  for(const sx of [-1,1]){
    const tx=cx+sx*s*.62-s*.17;
    stone(tx,cy-s*.34,s*.34,s*1.06);
    merlon(tx-s*.03,cy-s*.34,s*.4);
    ctx.fillStyle="#2f353f"; roundRect(tx+s*.11,cy-s*.1,s*.12,s*.2,s*.06); ctx.fill();
  }
  // 본체
  stone(cx-s*.44,cy-s*.1,s*.88,s*.82);
  merlon(cx-s*.48,cy-s*.1,s*.96);
  // 중앙 높은 탑
  stone(cx-s*.19,cy-s*.72,s*.38,s*.64);
  merlon(cx-s*.22,cy-s*.72,s*.44);
  ctx.fillStyle="#2f353f"; roundRect(cx-s*.06,cy-s*.56,s*.12,s*.22,s*.06); ctx.fill();
  // 아치문
  ctx.fillStyle="#4a4640";
  ctx.beginPath(); ctx.moveTo(cx-s*.19,cy+s*.72); ctx.lineTo(cx-s*.19,cy+s*.28);
  ctx.arc(cx,cy+s*.28,s*.19,Math.PI,0); ctx.lineTo(cx+s*.19,cy+s*.72); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#5c3f20";
  ctx.beginPath(); ctx.moveTo(cx-s*.15,cy+s*.72); ctx.lineTo(cx-s*.15,cy+s*.29);
  ctx.arc(cx,cy+s*.29,s*.15,Math.PI,0); ctx.lineTo(cx+s*.15,cy+s*.72); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="rgba(40,26,10,.55)"; ctx.lineWidth=1.4;
  for(let i=1;i<3;i++){ ctx.beginPath();
    ctx.moveTo(cx-s*.15+i*s*.1,cy+s*.72); ctx.lineTo(cx-s*.15+i*s*.1,cy+s*.2); ctx.stroke(); }
  ctx.fillStyle="#c9a94a"; circle(cx+s*.07,cy+s*.52,s*.028);
  // 도개교 사슬
  ctx.strokeStyle="#6f6a60"; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(cx-s*.2,cy+s*.24); ctx.lineTo(cx-s*.3,cy+s*.72); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+s*.2,cy+s*.24); ctx.lineTo(cx+s*.3,cy+s*.72); ctx.stroke();
  // 덩굴
  ctx.strokeStyle="#3f8a35"; ctx.lineWidth=2.2; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(cx-s*.44,cy+s*.06);
  ctx.quadraticCurveTo(cx-s*.34,cy+s*.3,cx-s*.4,cy+s*.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+s*.45,cy-s*.02);
  ctx.quadraticCurveTo(cx+s*.34,cy+s*.24,cx+s*.42,cy+s*.5); ctx.stroke();
  ctx.fillStyle="#57a943";
  circle(cx-s*.36,cy+s*.22,s*.05); circle(cx-s*.42,cy+s*.42,s*.045);
  circle(cx+s*.38,cy+s*.14,s*.045); circle(cx+s*.43,cy+s*.36,s*.04);
  // 깃발
  ctx.strokeStyle="#7a6a52"; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(cx,cy-s*.86); ctx.lineTo(cx,cy-s*1.36); ctx.stroke();
  ctx.fillStyle="#c9a94a"; circle(cx,cy-s*1.38,s*.05);
  const fl=Math.sin(TT*2.6)*s*.05;
  ctx.fillStyle="#f4efe0";
  ctx.beginPath(); ctx.moveTo(cx,cy-s*1.33);
  ctx.quadraticCurveTo(cx+s*.28,cy-s*1.28+fl,cx+s*.5,cy-s*1.2);
  ctx.lineTo(cx+s*.42,cy-s*1.06);
  ctx.quadraticCurveTo(cx+s*.24,cy-s*1.0-fl,cx,cy-s*1.06); ctx.closePath(); ctx.fill();
  ctx.fillStyle="rgba(160,148,120,.35)";
  ctx.beginPath(); ctx.moveTo(cx,cy-s*1.2); ctx.quadraticCurveTo(cx+s*.24,cy-s*1.14+fl,cx+s*.46,cy-s*1.1);
  ctx.lineTo(cx+s*.42,cy-s*1.06); ctx.quadraticCurveTo(cx+s*.24,cy-s*1.0-fl,cx,cy-s*1.06); ctx.closePath(); ctx.fill();
  // 체력바
  const bw=s*1.5,bh=s*.19,by=cy+s*.86;
  ctx.fillStyle="rgba(20,14,4,.7)"; roundRect(cx-bw/2-2,by-2,bw+4,bh+4,(bh+4)/2); ctx.fill();
  ctx.fillStyle="#4a3418"; roundRect(cx-bw/2,by,bw,bh,bh/2); ctx.fill();
  const hg=ctx.createLinearGradient(0,by,0,by+bh);
  hg.addColorStop(0,"#ff9c88"); hg.addColorStop(1,"#c33a2c");
  ctx.fillStyle=hg; roundRect(cx-bw/2,by,bw*Math.max(0,S.castleHP/S.castleMax),bh,bh/2); ctx.fill();
}

   보스 보상 룰렛(돌림판)
========================================================= */
const WHEEL=[
 {n:"돈",      w:26,c:"#e8b02a",t:"gold",v:1.0},
 {n:"보석",    w:22,c:"#3f9ad8",t:"gem", v:1.0},
 {n:"큰 돈",   w:18,c:"#eec44e",t:"gold",v:2.4},
 {n:"보석 뭉치",w:14,c:"#57a9e2",t:"gem", v:2.5},
 {n:"신화",    w:11,c:"#c02f26",t:"unit",v:4},
 {n:"레전더리",w:6, c:"#e09a10",t:"unit",v:5},
 {n:"신화 영웅",w:3,c:"#d97bb6",t:"unit",v:6},
];
let wheelAng=0, spinning=false, wheelPending=false;
function drawWheel(){
  const c=$("wheelCv"),g=c.getContext("2d");
  g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,460,460);
  const R=210,cx=230,cy=230;
  const tot=WHEEL.reduce((a,b)=>a+b.w,0);
  g.save(); g.translate(cx,cy); g.rotate(wheelAng);
  let a0=-Math.PI/2;
  WHEEL.forEach(s=>{
    const a1=a0+s.w/tot*6.2832;
    g.beginPath(); g.moveTo(0,0); g.arc(0,0,R,a0,a1); g.closePath();
    const gr=g.createRadialGradient(0,0,R*.2,0,0,R);
    gr.addColorStop(0,s.c); gr.addColorStop(1,shade(s.c,-46));
    g.fillStyle=gr; g.fill();
    g.strokeStyle="rgba(60,36,10,.55)"; g.lineWidth=4; g.stroke();
    g.save(); g.rotate((a0+a1)/2); g.textAlign="right"; g.textBaseline="middle";
    g.font="bold 26px system-ui"; g.lineWidth=6; g.strokeStyle="rgba(30,18,4,.6)";
    g.strokeText(s.n,R-18,0); g.fillStyle="#fff6e2"; g.fillText(s.n,R-18,0);
    g.restore();
    a0=a1;
  });
  g.restore();
  g.beginPath(); g.arc(cx,cy,R+8,0,6.2832);
  g.strokeStyle="#6b4a24"; g.lineWidth=14; g.stroke();
  g.strokeStyle="#c99a58"; g.lineWidth=7; g.stroke();
  g.beginPath(); g.arc(cx,cy,30,0,6.2832); g.fillStyle="#6b4a24"; g.fill();
  g.beginPath(); g.arc(cx,cy,22,0,6.2832); g.fillStyle="#f0d9a4"; g.fill();
}
function pickWheel(){
  const tot=WHEEL.reduce((a,b)=>a+b.w,0);
  let r=Math.random()*tot;
  for(let i=0;i<WHEEL.length;i++){ if((r-=WHEEL[i].w)<0) return i; }
  return 0;
}
function openWheel(st){
  wheelPending=true; spinning=false;
  $("wheelTitle").textContent=(BOSS[st]?BOSS[st].name:"보스")+" 격파!";
  $("wheelRes").textContent="";
  $("btnSpin").style.display=""; $("btnSpin").disabled=false;
  $("btnCloseWheel").style.display="none";
  wheelAng=0; drawWheel(); $("wheelScreen").classList.add("on");
}
function spinWheel(){
  if(spinning) return;
  spinning=true; $("btnSpin").disabled=true;
  const idx=pickWheel(), tot=WHEEL.reduce((a,b)=>a+b.w,0);
  let acc=0; for(let i=0;i<idx;i++) acc+=WHEEL[i].w;
  const mid=(acc+WHEEL[idx].w/2)/tot*6.2832;
  const target=6.2832*6 - mid;           // 핀은 위쪽(-90°) 기준
  const t0=performance.now(), dur=3600;
  (function anim(now){
    const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3.4);
    wheelAng=target*e; drawWheel();
    if(k<1) requestAnimationFrame(anim);
    else{ spinning=false; grantWheel(idx); }
  })(t0);
}
function grantWheel(i){
  const s=WHEEL[i], st=S?S.stage:10;
  let msg="";
  if(s.t==="gold"){ const g=Math.round((60+st*12)*s.v); S.gold+=g; msg="돈 +"+g; }
  else if(s.t==="gem"){ const g=Math.round((4+st*.25)*s.v); S.gem+=g; msg="보석 +"+g; }
  else{
    if(unitCnt()>=MAX_UNIT){ const g=Math.round(400*s.v); S.gold+=g; msg="칸이 가득 차 돈 +"+g; }
    else{ const k=placeUnit(s.v); msg="★ "+TIERS[s.v].name+" "+UMAP[S.cells[k].type].name+" 획득!";
          showcase(S.cells[k]); }
  }
  $("wheelRes").innerHTML="<span style='color:"+s.c+"'>"+msg+"</span>";
  $("btnSpin").style.display="none"; $("btnCloseWheel").style.display="";
  syncUI();
}
$("btnSpin").onclick=spinWheel;
$("btnCloseWheel").onclick=()=>{ wheelPending=false; $("wheelScreen").classList.remove("on"); };

const mapCv=$("mapCv"); const mapCtx=mapCv.getContext("2d");
let MAPH=1200, NODES=[], MTREES=[];
function layoutMap(){
  const w=window.innerWidth;
  MAPH=Math.max(window.innerHeight+260,1200);
  const dpr=Math.min(2,window.devicePixelRatio||1);
  mapCv.width=w*dpr; mapCv.height=MAPH*dpr; mapCv.style.height=MAPH+"px";
  mapCtx.setTransform(dpr,0,0,dpr,0,0);
  NODES=[];
  const top=150, bot=MAPH-170, step=(bot-top)/9;
  for(let i=0;i<10;i++){
    NODES.push({st:(i+1)*10, x:w/2, y:bot-i*step});
  }
  let seed=8811;
  const rnd=()=>(seed=(seed*1103515245+12345)%2147483648)/2147483648;
  MTREES=[];
  const roadHalf=Math.min(84,w*0.22);
  for(let y=-8;y<MAPH+20;y+=30){
    for(let x=-8;x<w+20;x+=30){
      const px=x+(rnd()-.5)*10, py=y+(rnd()-.5)*10;
      let cxr=w/2;
      for(let k=NODES.length-1;k>=0;k--) if(py<=NODES[k].y+40) cxr=NODES[k].x;
      if(Math.abs(px-cxr)<roadHalf) continue;
      MTREES.push({x:px,y:py,r:19+rnd()*3,v:rnd(),lean:(rnd()-.5)*.1,b:rnd()});
    }
  }
  MTREES.sort((a,b)=>a.y-b.y);
  drawMap(); buildNodes();
  $("mapWrap").scrollTop=MAPH;
}
function drawMap(){
  if(!NODES.length) return;
  const prev=ctx; ctx=mapCtx;
  const w=window.innerWidth;
  const g=ctx.createLinearGradient(0,0,0,MAPH);
  g.addColorStop(0,"#3e6f2d"); g.addColorStop(.5,"#4d8137"); g.addColorStop(1,"#3a6a2a");
  ctx.fillStyle=g; ctx.fillRect(0,0,w,MAPH);
  ctx.globalAlpha=.05;
  for(let y=0;y<MAPH;y+=18){ ctx.fillStyle=(y/18)%2?"#1a3b14":"#6fa353"; ctx.fillRect(0,y,w,9); }
  ctx.globalAlpha=1;
  // 흙길 (일직선)
  const road=(wd,col)=>{
    ctx.strokeStyle=col; ctx.lineWidth=wd; ctx.lineJoin="round"; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(NODES[0].x,MAPH-30); ctx.lineTo(NODES[9].x,50); ctx.stroke();
  };
  road(146,"#22461c"); road(138,"#8fbe5c"); road(126,"#6f4d24"); road(118,"#c7a262");
  ctx.fillStyle="rgba(120,86,40,.2)";
  for(let i=0;i<220;i++){
    const t=i/220, y=MAPH-30-(MAPH-80)*t;
    let x=NODES[0].x;
    for(let k=NODES.length-1;k>=0;k--) if(y<=NODES[k].y+40) x=NODES[k].x;
    circle(x+((i*67)%90-45),y,1.5);
  }
  for(const t of MTREES) drawTree(t);
  // 노드
  const best=meta.best[meta.diff]||0;
  for(const n of NODES){
    const done=best>=n.st, B=BOSS[n.st], T=MT[B.base];
    ctx.fillStyle="rgba(20,40,16,.28)";
    ctx.beginPath(); ctx.ellipse(n.x,n.y+34,46,12,0,0,6.2832); ctx.fill();
    // 돌 받침
    ctx.fillStyle="#5d5b57"; roundRect(n.x-46,n.y+10,92,24,11); ctx.fill();
    ctx.fillStyle="#a9a49a"; roundRect(n.x-43,n.y+12,86,17,9); ctx.fill();
    ctx.fillStyle="#8b8780"; roundRect(n.x-43,n.y+21,86,8,5); ctx.fill();
    const fake={t:B.base,boss:true,B:B,wob:TT*2+n.st,hp:1,maxhp:1,r:20,d:0,hit:0};
    ctx.save(); ctx.translate(n.x,n.y-2);
    if(T.draw==="slime") drawSlimeM({x:0,y:0},20,fake,T); else drawHumanM({x:0,y:0},19,fake,T);
    ctx.restore();
    if(!done){ ctx.fillStyle="rgba(8,14,6,.55)"; roundRect(n.x-50,n.y-50,100,88,18); ctx.fill(); }
    ctx.font="bold 15px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.strokeStyle="rgba(20,14,4,.72)"; ctx.lineWidth=4.5;
    ctx.strokeText(n.st+" 스테이지",n.x,n.y+21);
    ctx.fillStyle=done?"#ffe9a8":"#d8ddcd"; ctx.fillText(n.st+" 스테이지",n.x,n.y+21);
    if(done){ ctx.font="bold 13px system-ui"; ctx.strokeText("클리어",n.x,n.y-46);
      ctx.fillStyle="#a8e878"; ctx.fillText("클리어",n.x,n.y-46); }
  }
  ctx=prev;
}
function buildNodes(){
  const layer=$("nodeLayer"); layer.innerHTML=""; layer.style.height=MAPH+"px";
  const best=meta.best[meta.diff]||0;
  for(const n of NODES){
    const key=meta.diff+"-"+n.st;
    if(best>=n.st&&!meta.claim[key]){
      const b=document.createElement("button");
      b.className="rewardBtn"; b.textContent="보상 받기";
      b.style.left=n.x+"px"; b.style.top=(n.y+38)+"px";
      b.onclick=()=>{
        meta.claim[key]=true;
        const r=Math.round(n.st*30*(1+DIFFS.findIndex(d=>d.id===meta.diff)*0.6));
        meta.coin+=r; saveMeta(); refreshMeta(); buildNodes();
        toast(n.st+" 스테이지 보상 코인 +"+r,"#ffd463");
      };
      layer.appendChild(b);
    }
  }
}
function buildDiff(){
  const row=$("diffRow"); row.innerHTML="";
  DIFFS.forEach(d=>{
    const open=diffOpen(d);
    const b=document.createElement("button");
    b.className="dbtn"+(meta.diff===d.id?" sel":"")+(open?"":" lock");
    b.textContent=d.name;
    b.onclick=()=>{
      if(!open) return toast(diffOf(d.need).name+" 난이도를 먼저 클리어해야 해");
      meta.diff=d.id; saveMeta(); buildDiff(); drawMap(); buildNodes();
    };
    row.appendChild(b);
  });
}
const todayStr=()=>{ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); };
function refreshDaily(){
  const dl=$("dailyLabel"), db=$("btnDaily"); if(!dl||!db) return;
  const ok=meta.daily!==todayStr();
  dl.textContent=ok?"1일 보상":"내일 다시";
  db.disabled=!ok;
}
function claimDaily(){
  if(meta.daily===todayStr()) return;
  meta.daily=todayStr(); meta.streak=(meta.streak||0)+1;
  const r=200+Math.min(meta.streak,7)*50;
  meta.coin+=r; saveMeta(); refreshMeta();
  toast("1일 보상 코인 +"+r+" (연속 "+meta.streak+"일)","#e8b02a");
}

/* =========================================================
   유닛 상점
========================================================= */
let shopSel="knight";
function openShop(){ buildShop(); $("shopScreen").classList.add("on"); }
function buildShop(){
  const grid=$("ugrid"); grid.innerHTML="";
  UNITS.forEach(k=>{
    const own=!!meta.owned[k.id];
    const d=document.createElement("div");
    d.className="ucard"+(shopSel===k.id?" sel":"")+(own?"":" lock");
    const c=document.createElement("canvas"); c.width=88; c.height=88; d.appendChild(c);
    const nm=document.createElement("div"); nm.className="un"; nm.textContent=k.name; d.appendChild(nm);
    const pz=document.createElement("div"); pz.className="pz";
    pz.innerHTML=own?"보유":('<span class="ic" data-ico="pouch"></span>'+k.price);
    d.appendChild(pz);
    d.onclick=()=>{
      if(!own){
        if(meta.coin<k.price) return toast("코인이 부족해");
        meta.coin-=k.price; meta.owned[k.id]=true; saveMeta(); refreshMeta();
        toast(k.name+" 해금!","#8dc964");
      }
      shopSel=k.id; buildShop();
    };
    grid.appendChild(d);
    const pc=c.getContext("2d"); pc.setTransform(2,0,0,2,0,0);
    const prev=ctx; ctx=pc;
    drawUnitBody(22,26,38,{tier:own?3:1,type:k.id,phase:0,anim:0,lunge:0,lx:0,ly:0},false);
    ctx=prev;
  });
  setIcons(grid); buildUpList();
}
function buildUpList(){
  const box=$("upList"); box.innerHTML="";
  const k=UMAP[shopSel];
  const head=document.createElement("div");
  head.style.cssText="font-size:12px;color:#7d6234;margin:2px 0 7px;text-align:left";
  head.textContent=k.name+" · "+k.desc+" · 사거리 "+k.rn;
  box.appendChild(head);
  for(let t=1;t<=8;t++){
    const T=TIERS[t],lv=metaLv(k.id,t),cost=metaCost(k.id,t);
    const row=document.createElement("div"); row.className="lrow";
    row.innerHTML='<span class="ic" data-ico="sword"></span>'+
      '<span class="nm">'+T.name+'<small>Lv.'+lv+' · 공격력 +'+(lv*8)+'%</small></span>'+
      '<span class="cs"><span class="ic" data-ico="pouch"></span>'+cost+'</span>';
    row.onclick=()=>{
      if(meta.coin<cost) return toast("코인이 부족해");
      meta.coin-=cost;
      if(!meta.up[k.id]) meta.up[k.id]={};
      meta.up[k.id][t]=lv+1; saveMeta(); refreshMeta(); buildUpList();
      toast(T.name+" "+k.name+" 강화 Lv."+(lv+1),T.rim);
    };
    box.appendChild(row);
  }
  setIcons(box);
}

/* =========================================================
   로그인 / 회원가입 (로컬 저장, 클라이언트 데모용)
========================================================= */
const auth={user:null,users:{}};
async function saveAuth(){ try{ if(window.storage){
  await window.storage.set("wt_auth_user",auth.user||"");
  await window.storage.set("wt_auth_users",JSON.stringify(auth.users)); } }catch(e){} }
async function loadAuth(){
  try{ if(window.storage){
    const u=await window.storage.get("wt_auth_user").catch(()=>null);
    const us=await window.storage.get("wt_auth_users").catch(()=>null);
    if(u&&u.value) auth.user=u.value;
    if(us&&us.value) auth.users=JSON.parse(us.value);
  } }catch(e){}
  refreshAuthUI();
}
function refreshAuthUI(){
  const logged=!!auth.user;
  $("authBtns").style.display=logged?"none":"flex";
  $("authPlayWrap").style.display=logged?"block":"none";
}
let amMode="login";
function openAuthModal(mode){
  amMode=mode;
  $("amTitle").textContent=mode==="login"?"로그인":"회원가입";
  $("amNick").value=""; $("amPw").value="";
  $("amPw").classList.remove("bad"); $("amWarn").textContent="";
  $("authModal").classList.add("on");
  setTimeout(()=>$("amNick").focus(),380);
}
function closeAuthModal(){ $("authModal").classList.remove("on"); }
$("amPw").addEventListener("input",()=>{
  const ok=$("amPw").value.length>=8;
  $("amPw").classList.toggle("bad",!ok);
  $("amWarn").textContent=ok?"":"비밀번호는 8자 이상이어야 합니다";
});
function submitAuth(){
  const nick=$("amNick").value.trim(), pw=$("amPw").value;
  if(!nick) return toast("닉네임을 입력해줘");
  if(pw.length<8){ $("amPw").classList.add("bad");
    $("amWarn").textContent="비밀번호는 8자 이상이어야 합니다"; return; }
  if(amMode==="signup"){
    if(auth.users[nick]) return toast("이미 있는 닉네임이야");
    auth.users[nick]=pw; auth.user=nick; saveAuth();
    toast("회원가입 완료!","#8dc964");
  } else {
    if(auth.users[nick]!==pw) return toast("닉네임 또는 비밀번호가 달라");
    auth.user=nick; saveAuth();
    toast("환영해, "+nick+"!","#8dc964");
  }
  closeAuthModal(); refreshAuthUI();
}
$("btnLogin").onclick=()=>openAuthModal("login");
$("btnSignup").onclick=()=>openAuthModal("signup");
$("amSubmit").onclick=submitAuth;
$("amClose").onclick=closeAuthModal;
$("btnAuthPlay").onclick=()=>{
  $("authScreen").classList.remove("on");
  const m=$("mainScreen");
  m.classList.add("on","slideUp");
  refreshMeta(); buildDiff(); drawMap(); buildNodes();
  requestAnimationFrame(()=>requestAnimationFrame(()=>m.classList.remove("slideUp")));
};

/* =========================================================
   화면 전환
========================================================= */
function showMain(){
  playing=false; hidePop(); drag=null;
  ["rouletteScreen","upgradeScreen","shopScreen","endScreen"].forEach(i=>$(i).classList.remove("on"));
  $("endPanel").classList.remove("drop");
  $("ui").classList.add("off");
  refreshMeta(); buildDiff(); drawMap(); buildNodes();
  const m=$("mainScreen");
  m.classList.add("on","slideUp");
  requestAnimationFrame(()=>requestAnimationFrame(()=>m.classList.remove("slideUp")));
}
function pressPlay(){
  const c=$("curtain");
  c.classList.remove("up"); c.classList.add("on");
  setTimeout(()=>{
    $("mainScreen").classList.remove("on");
    $("endScreen").classList.remove("on");
    $("endPanel").classList.remove("drop");
    newGame(); playing=true; resize();
    $("ui").classList.remove("off");
    c.classList.add("up");
    setTimeout(()=>{ c.classList.remove("on","up"); },560);
  },3000);
}
function endGame(win){
  S.over=true; playing=false; hidePop(); drag=null;
  meta.coin+=S.coin;
  if(win) meta.clear[S.diff]=true;
  if(meta.best[S.diff]<S.stage) meta.best[S.diff]=S.stage;
  saveMeta(); refreshMeta();
  $("ui").classList.add("off");
  $("endTitle").textContent=win?"클리어!":"패배..";
  $("endTitle").style.background=win?"linear-gradient(180deg,#5fa8e0,#2f7dbe)":"linear-gradient(180deg,#e0796a,#bb4433)";
  $("endTitle").style.borderColor=win?"#2a5c8f":"#8d2f22";
  $("endStage").textContent=S.stage;
  $("endTime").textContent=fmtTime(S.time);
  $("endKill").textContent=S.kills;
  $("endCoin").textContent=S.coin;
  const e=$("endScreen"),pn=$("endPanel");
  e.classList.add("on"); pn.classList.remove("drop"); void pn.offsetWidth; pn.classList.add("drop");
  buildDiff(); drawMap(); buildNodes();
}

/* =========================================================
   입력 — 더블탭 정보창 + 드래그 이동
========================================================= */
let drag=null, lastTapIdx=-1, lastTapT=0;
function cellAt(x,y){
  for(let i=0;i<MAX_UNIT;i++){
    const c=CELLS[i];
    if(x>=c.x&&x<=c.x+c.s&&y>=c.y&&y<=c.y+c.s) return i;
  }
  return -1;
}
cvEl.addEventListener("pointerdown",e=>{
  if(!playing||S.over) return;
  const i=cellAt(e.clientX,e.clientY);
  if(i<0){ hidePop(); return; }
  drag={from:i,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,
        moved:false,over:i,unit:S.cells[i]};
  cvEl.setPointerCapture(e.pointerId);
});
cvEl.addEventListener("pointermove",e=>{
  if(!drag) return;
  drag.x=e.clientX; drag.y=e.clientY;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>9&&drag.unit){
    drag.moved=true; hidePop();
  }
  if(drag.moved) drag.over=cellAt(e.clientX,e.clientY);
});
function endDrag(e){
  if(!drag) return;
  const d=drag; drag=null;
  if(d.moved){
    const to=cellAt(e.clientX,e.clientY);
    if(to>=0&&to!==d.from){
      const a=S.cells[d.from]; S.cells[d.from]=S.cells[to]; S.cells[to]=a;
    }
    return;
  }
  // 탭 → 더블탭이면 정보창
  const now=performance.now();
  if(lastTapIdx===d.from&&now-lastTapT<330){
    lastTapIdx=-1;
    if(S.cells[d.from]){ S.selected=d.from; showPop(d.from); }
  } else { lastTapIdx=d.from; lastTapT=now; hidePop(); }
}
cvEl.addEventListener("pointerup",endDrag);
cvEl.addEventListener("pointercancel",()=>{ drag=null; });

$("popUp").onclick=()=>doMerge(+popEl.dataset.idx);
$("popSellG").onclick=()=>doSell(+popEl.dataset.idx,"g");
$("popSellM").onclick=()=>doSell(+popEl.dataset.idx,"m");
$("btnPlay").onclick=pressPlay;
$("btnRetry").onclick=()=>{ $("endScreen").classList.remove("on"); pressPlay(); };
$("btnHome").onclick=showMain;
if($("btnShop")) $("btnShop").onclick=openShop;
if($("btnCloseShop")) $("btnCloseShop").onclick=()=>$("shopScreen").classList.remove("on");
if($("btnDaily")) $("btnDaily").onclick=claimDaily;
$("btnSummon").onclick=doSummon;
$("btnUpgrade").onclick=openUpgrade;
$("btnCloseUpgrade").onclick=()=>$("upgradeScreen").classList.remove("on");
$("upHP").onclick=buyHP; $("upATK").onclick=buyATK; $("upSUM").onclick=buySUM;
$("btnRoulette").onclick=openRoulette;
$("btnCloseRoulette").onclick=()=>$("rouletteScreen").classList.remove("on");
$("btnDraw").onclick=doDraw;
document.querySelectorAll("#rouletteScreen .rcard").forEach(r=>{
  r.onclick=()=>{ pickTier=+r.dataset.tier; updateRouletteUI(); };
});
$("btnSpeed").onclick=()=>{ S.speed=S.speed===1?2:(S.speed===2?3:1); syncUI(); };
$("btnPause").onclick=()=>{
  paused=!paused;
  $("btnPause").firstElementChild.innerHTML=paused?ICON.play:ICON.pause;
  $("btnPause").lastElementChild.textContent=paused?"재개":"정지";
};
window.addEventListener("resize",()=>{ resize(); });

/* =========================================================
   루프
========================================================= */
let last=performance.now(), acc=0;
const FRAME=1/60;
function loop(now){
  requestAnimationFrame(loop);
  let raw=(now-last)/1000;
  if(raw<FRAME-0.0015) return;           // 60fps 상한
  last=now;
  raw=Math.min(.05,raw); TT+=raw;
  if(playing&&S&&!S.over&&!paused&&!wheelPending){
    S.time+=raw; update(raw*S.speed);
    $("timer").textContent=fmtTime(S.time);
  }
  if(playing&&S) draw();
}
setIcons();
newGame(); playing=false;
resize(); buildDiff();
loadMeta();
loadAuth();
requestAnimationFrame(loop);
</script>
