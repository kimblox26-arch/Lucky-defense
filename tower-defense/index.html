<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>INFINITE TOWER DEFENSE — 무한의 탑 디펜스</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🏰</text></svg>">
</head>
<body>

<canvas id="cv"></canvas>

<!-- ======================================================= 화면 가장자리 연출 -->
<div id="vign" class="vign"></div>

<!-- ======================================================= 상단 HUD -->
<div id="hud" class="hud hidden">
  <div class="hud-row">
    <div class="stat life"  id="statLife"><span class="ic">♥</span><b id="vLife">20</b></div>
    <div class="stat gold"  id="statGold"><span class="ic">🪙</span><b id="vGold">0</b></div>
    <div class="stat gem"   id="statGem"><span class="ic">💎</span><b id="vGem">0</b></div>
    <div class="stat wave"  id="statWave"><span class="ic">🌊</span><b id="vWave">0</b><i id="vLoop"></i></div>
  </div>
  <div class="hud-row2">
    <div class="manabar"><div class="fill" id="manaFill"></div><span id="vMana">0/100</span></div>
    <div class="wavebar"><div class="fill" id="waveFill"></div><span id="vWaveProg">대기</span></div>
  </div>
  <div id="comboBox" class="combo hidden"><b id="vCombo">0</b><span>COMBO</span><i id="vComboMul">x1.0</i></div>
</div>

<!-- ======================================================= 시너지 -->
<div id="synPanel" class="syn-panel hidden"></div>

<!-- ======================================================= 축복 띠 -->
<div id="blessStrip" class="bl-strip hidden"></div>

<!-- ======================================================= 축복 드래프트 -->
<div id="blessWrap" class="bl-wrap hidden"></div>

<!-- ======================================================= 스킬바 -->
<div id="skillBar" class="skillbar hidden"></div>

<!-- ======================================================= 웨이브 예고 -->
<div id="wavePreview" class="wave-preview hidden"></div>

<!-- ======================================================= 하단 조작 -->
<div id="bottom" class="bottom hidden">
  <!-- 도구 줄 : 메뉴 안에 묻어 두지 않고 바로 누를 수 있게 밖으로 뺐다 -->
  <div class="btools">
    <button class="qbtn" id="btnSkills"  data-tip="스킬 장착"><span class="ti">✨</span><span class="tn">스킬</span></button>
    <button class="qbtn" id="btnResearch"><span class="ti">⚗</span><span class="tn">연구</span><i class="tdot hidden" id="dotResearch"></i></button>
    <button class="qbtn" id="btnCodexIn" data-tip="도감"><span class="ti">📖</span><span class="tn">도감</span></button>
    <button class="qbtn" id="btnRouletteIn"><span class="ti">🎡</span><span class="tn">룰렛</span><i class="tdot hidden" id="dotRoulette"></i></button>
    <button class="qbtn" id="btnToolsIn"><span class="ti">🛠</span><span class="tn">도구</span></button>
    <span class="tsep"></span>
    <button class="qbtn sm" id="btnSpeed"><span class="ti" id="speedIco">▶</span><span class="tn">x1</span></button>
    <button class="qbtn sm" id="btnPause"><span class="ti">⏸</span><span class="tn">정지</span></button>
    <button class="qbtn sm" id="btnMenu"><span class="ti">☰</span><span class="tn">메뉴</span></button>
  </div>

  <!-- 주 조작 줄 : 가장 자주 누르는 4개 -->
  <div class="bmain">
    <button class="bbtn primary" id="btnSummon">
      <span class="bico">✨</span><span class="blab">소환</span><span class="bsub" id="summonCost">30G</span>
    </button>
    <button class="bbtn primary ten" id="btnSummon10">
      <span class="bico">🎰</span><span class="blab">10연소환</span><span class="bsub" id="summon10Cost">300G</span>
    </button>
    <button class="bbtn" id="btnMerge">
      <span class="bico">⇪</span><span class="blab">자동합성</span><span class="bsub" id="mergeCount">0쌍</span>
    </button>
    <button class="bbtn wavebtn" id="btnWave">
      <span class="bico">⚔</span><span class="blab">웨이브</span><span class="bsub" id="waveSub">시작</span>
    </button>
  </div>
</div>

<!-- ======================================================= 유닛 상세 -->
<div id="unitPanel" class="unit-panel hidden">
  <button class="close" id="unitClose">✕</button>
  <div class="up-head">
    <canvas id="upPortrait" width="160" height="160"></canvas>
    <div class="up-title">
      <div class="up-name" id="upName">—</div>
      <div class="up-tags"><span id="upRarity" class="tag"></span><span id="upClass" class="tag"></span><span id="upElem" class="tag"></span></div>
      <div class="up-stars" id="upStars"></div>
    </div>
  </div>
  <div class="up-desc" id="upDesc"></div>
  <div class="up-stats" id="upStats"></div>
  <div class="up-target"><span>타겟팅</span><div class="segs" id="upTargets"></div></div>
  <div class="up-actions">
    <button class="ubtn up" id="btnUpgrade"><b>강화</b><i id="upgCost">-</i></button>
    <button class="ubtn mg" id="btnMergeOne"><b>합성</b><i id="mergeInfo">-</i></button>
    <button class="ubtn sell" id="btnSell"><b>판매</b><i id="sellVal">-</i></button>
    <button class="ubtn lock" id="btnLock"><b>잠금</b><i id="lockState">해제됨</i></button>
  </div>
</div>

<!-- ======================================================= 인게임 모달 -->
<div id="modalWrap" class="modal-wrap hidden">
  <div class="modal" id="modal">
    <div class="modal-head"><h2 id="modalTitle">제목</h2><button class="close" id="modalClose">✕</button></div>
    <div class="modal-tabs" id="modalTabs"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ======================================================= 알림 -->
<div id="toasts" class="toasts"></div>
<div id="banner" class="banner hidden"></div>
<div id="rarityBanner" class="rarity-banner hidden">
  <div class="rb-confetti" id="rbConfetti"></div>
  <div class="rb-tag" id="rbTag"></div>
  <canvas id="rbCanvas" width="220" height="220"></canvas>
  <div class="rb-text"><div class="rb-rare" id="rbRare"></div><div class="rb-name" id="rbName"></div></div>
</div>

<!-- ======================================================= 10연소환 결과 -->
<div id="multiPull" class="multi-pull hidden">
  <div class="mp-box">
    <div class="mp-head"><h2 id="mpTitle">10연 소환 결과</h2><button class="close" id="mpClose">✕</button></div>
    <div class="mp-grid" id="mpGrid"></div>
    <button class="bigbtn" id="mpOk">확인</button>
  </div>
</div>
<div id="achPop" class="ach-pop hidden">
  <div class="ap-ico" id="apIco">🏆</div>
  <div><div class="ap-t" id="apTitle"></div><div class="ap-d" id="apDesc"></div><div class="ap-g" id="apGem"></div></div>
</div>

<!-- ======================================================= 로그인 화면 -->
<div id="auth" class="auth-screen hidden">
  <div class="bg-orbs"><i></i><i></i><i></i></div>
  <h1 class="auth-logo">INFINITE<br><span>TOWER DEFENSE</span></h1>
  <div class="auth-box">
    <div class="auth-tabs">
      <button id="authTabLogin" class="on">로그인</button>
      <button id="authTabSignup">회원가입</button>
    </div>
    <input class="inp" id="authId" type="text" autocomplete="username" placeholder="아이디 (영문/숫자 3~20자)">
    <input class="inp" id="authPw" type="password" autocomplete="current-password" placeholder="비밀번호 (4자 이상)">
    <div id="signupOnly" class="hidden">
      <input class="inp" id="authNick" type="text" maxlength="12" placeholder="닉네임 (2~12자)">
    </div>
    <div class="auth-err" id="authError"></div>
    <button class="bigbtn" id="authSubmit">로그인</button>

    <div class="auth-div"><span>또는</span></div>
    <div id="googleBtn" class="gbtn-wrap"></div>
    <div class="gnote" id="googleNote"></div>
    <button class="ghostbtn" id="authGuest">게스트로 바로 시작</button>
    <div id="quickAccounts" class="quick-accounts hidden"></div>
  </div>
  <div class="auth-foot">진행도는 이 브라우저에 저장된다 · v2.0</div>
</div>

<!-- ======================================================= 메인 로비 -->
<div id="lobby" class="lobby hidden">
  <div class="bg-orbs"><i></i><i></i><i></i></div>
  <canvas id="lbFx" class="lb-fx"></canvas>

  <!-- 상단 쇼케이스 : 이번에 뽑은/보유한 유닛을 크게 보여 준다 -->
  <div class="lb-hero" id="lbHero">
    <canvas id="lbHeroCv" class="lb-hero-cv"></canvas>
    <div class="lb-hero-txt">
      <div class="lb-hero-name" id="lbHeroName">무한의 탑</div>
      <div class="lb-hero-sub" id="lbHeroSub">디펜스</div>
    </div>
    <button class="lb-hero-next" id="lbHeroNext" title="다른 유닛 보기">🔄</button>
  </div>

  <div class="lb-top">
    <div class="lb-card">
      <div class="lb-avatar" id="lbAvatar"><canvas id="lbAvatarCv" width="200" height="200"></canvas>
        <div class="lb-badge" id="lbBadge">⭐</div>
      </div>
      <div class="lb-info">
        <div class="lb-title" id="lbTitle">신병</div>
        <div class="lb-nick" id="lbNick">용사</div>
        <div class="lb-kind" id="lbKind"></div>
        <div class="lb-exp">
          <span id="lbLevel">Lv.1</span>
          <div class="lb-expbar"><div class="fill" id="lbExpFill"></div></div>
          <i id="lbExpText">0 / 100</i>
        </div>
      </div>
      <div class="lb-cur"><span>💎</span><b id="lbGem">0</b></div>
    </div>
    <div class="lb-stats" id="lbStats"></div>
  </div>

  <div class="lb-menu">
    <button class="lmbtn big" id="btnPlay"><span class="lm-i">⚔</span><span class="lm-n">전투 시작</span></button>
    <button class="lmbtn" id="btnProfile" style="--c:#ff7ac4"><span class="lm-i">🎨</span><span class="lm-n">프로필</span></button>
    <button class="lmbtn" id="btnShop" style="--c:#7cff9c"><span class="lm-i">🛒</span><span class="lm-n">상점</span></button>
    <button class="lmbtn" id="btnCollection" style="--c:#4ea8ff"><span class="lm-i">📖</span><span class="lm-n">도감</span></button>
    <button class="lmbtn" id="btnAchieve" style="--c:#ffd24d"><span class="lm-i">🏆</span><span class="lm-n">업적</span></button>
    <button class="lmbtn" id="btnHonor" style="--c:#7fd8ff"><span class="lm-i">💎</span><span class="lm-n">명예 강화</span></button>
    <button class="lmbtn" id="btnDaily" style="--c:#ff9a3c"><span class="lm-i">📅</span><span class="lm-n">출석</span><i class="dot hidden" id="badgeDaily"></i></button>
    <button class="lmbtn" id="btnQuest" style="--c:#c48fff"><span class="lm-i">📜</span><span class="lm-n">퀘스트</span><i class="dot hidden" id="badgeQuest"></i></button>
    <button class="lmbtn" id="btnRoulette" style="--c:#ffd24d"><span class="lm-i">🎡</span><span class="lm-n">룰렛</span><i class="dot hidden" id="badgeRoulette"></i></button>
    <button class="lmbtn" id="btnRecords" style="--c:#8fd0ff"><span class="lm-i">📊</span><span class="lm-n">전적</span></button>
    <button class="lmbtn" id="btnSetting" style="--c:#9fb0cc"><span class="lm-i">⚙</span><span class="lm-n">설정</span></button>
    <button class="lmbtn" id="btnAccount" style="--c:#6fe0d0"><span class="lm-i">👤</span><span class="lm-n">계정</span></button>
  </div>

  <div class="lb-tip" id="lbTip"></div>
</div>

<!-- ======================================================= 로비 패널 -->
<div id="lobbyPanel" class="lobby-panel hidden">
  <div class="lp-box">
    <div class="lp-head"><h2 id="lpTitle">패널</h2><button class="close" id="lpClose">✕</button></div>
    <div class="lp-body" id="lpBody"></div>
  </div>
</div>

<!-- ======================================================= 상세 모달 -->
<div id="detailModal" class="detail-modal hidden"></div>

<!-- ======================================================= 결과 -->
<div id="result" class="result-screen hidden">
  <h2 id="resTitle">GAME OVER</h2>
  <div class="res-avatar"><canvas id="resAvatar" width="180" height="180"></canvas></div>
  <div class="res-exp" id="resExp"></div>
  <div class="res-grid" id="resGrid"></div>
  <div class="res-bless" id="resBless"></div>
  <div class="res-btns">
    <button class="tbtn play" id="btnRetry">다시 도전</button>
    <button class="tbtn" id="btnToTitle">로비로</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/gfx.js"></script>
<script src="js/effects.js"></script>
<script src="js/render.js"></script>
<script src="js/entities.js"></script>
<script src="js/game.js"></script>
<script src="js/account.js"></script>
<script src="js/lobby.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/ui.js"></script>
<script src="js/perf.js"></script>
<script src="js/roulette.js"></script>
<script src="js/blessing.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
